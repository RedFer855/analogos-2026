<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor</title>
<style>
  :root { --fondo: #05070d; --texto: #e8edf6; --acento: #6ea8ff; --borde: #1d2738; --tenue: #7b8aa0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main { display: grid; justify-items: center; gap: 20px; text-align: center; }
  a.abrir {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 22px 44px; border-radius: 14px;
    background: var(--acento); color: #04101f;
    font-size: 20px; font-weight: 700; letter-spacing: .2px;
    text-decoration: none; border: 1px solid transparent;
    box-shadow: 0 0 44px rgba(110, 168, 255, .30);
    transition: transform .12s ease, filter .12s ease;
  }
  a.abrir:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .puerto { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tenue); }
  .puerto input {
    width: 70px; padding: 5px 8px; font: inherit; font-size: 12.5px; text-align: center;
    color: var(--texto); background: #0c111c; border: 1px solid var(--borde); border-radius: 8px;
  }
  #aviso { font-size: 12.5px; color: var(--tenue); min-height: 1em; }
</style>
</head>
<body>
<main>
  <a class="abrir" id="abrir" href="http://localhost:5173/" target="_blank" rel="noopener">Abrir el visor →</a>
  <label class="puerto">puerto <input id="puerto" value="5173" inputmode="numeric" aria-label="puerto del visor"></label>
  <p id="aviso"></p>
</main>
<script>
const abrir = document.getElementById('abrir');
const campo = document.getElementById('puerto');
const aviso = document.getElementById('aviso');
function aplicar() {
  const p = String(campo.value || '5173').replace(/\D/g, '') || '5173';
  abrir.href = `http://localhost:${p}/`;
}
campo.addEventListener('input', aplicar);
aplicar();
abrir.addEventListener('click', () => {
  aviso.textContent = 'node scripts/iniciar.mjs';
  setTimeout(() => { aviso.textContent = ''; }, 8000);
});
</script>
</body>
</html>
